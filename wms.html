<style>

.rf-item img {

/* Estilos para los formularios y submódulos simulados */
.simulador-box {
    background: #fff;

.simulador-box select, .simulador-box input {

}
.btn-rf {
    background: #000;
    color: #fff;
    border: none;
    padding: 5px 8px;
    font-size: 10px;
    cursor: pointer;
    width: 100%;

.fondo3 {

    padding: 4px;
    font-size: 10px;

}
.fondo4 {

    background: #f0f0f0;

<script language="JavaScript">
function validarFiltroCompleto(form) {
    if (form.ruta.value == '') {
        alert('Debe digitar la ruta');
        form.ruta.focus();
        return false;
    }
    alert('¡Filtro de alistamiento aplicado con éxito!');
    abrirSimulacion('alistamiento');
    return false;
}

function validarAlistamiento(form) {
    if (form.punto.value == "") {
        alert("Debe digitar el punto");
        form.punto.focus();
        return false;
    }
    if (form.tipo_alistamiento.value == "") {
        alert("Debe digitar el tipo de alistamiento");
        form.tipo_alistamiento.focus();
        return false;
    }
    abrirSimulacion('filtro_completo');
    return false; 
}

                    </td></tr>

                    </td></tr>
                    <tr><td class="fondo4"><div align="right"><b>Bod Dest</b></div></td><td class="fondo4">

                    </td></tr>
                </table>
                <br>
                <button class="btn-rf" type="submit">Continuar</button>
            </form>
            <br>
            <button class="btn-rf" style="background:#666;" onclick="abrirSimulacion('form_alistamiento')">Volver</button>
        `
    },
    recepcion: {
        titulo: "RECEPCION",
        html: `<p><b>Escanear SSCC:</b></p><input type="text" placeholder="SSCC..."><button class="btn-rf" onclick="alert('¡Registrado!'); volverAlMenu();">Aceptar</button>`

function abrirSimulacion(clave) {
    const datos = modulosWMS[clave];
    if (!datos) return;
    document.getElementById('menu-principal').style.display = 'none';
    const visor = document.getElementById('visor-simulador');
    visor.style.display = 'block';
    visor.innerHTML = `<div class="rf-header">${datos.titulo}</div><div class="simulador-box">${datos.html}</div>`;
}

function volverAlMenu() {
    document.getElementById('visor-simulador').style.display = 'none';
    document.getElementById('menu-principal').style.display = 'block';
}
